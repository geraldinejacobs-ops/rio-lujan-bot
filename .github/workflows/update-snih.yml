name: Actualizar niveles SNIH (todo el pais)

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-snih
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer los niveles del SNIH
        id: robot
        continue-on-error: true
        run: node scripts/update-snih.js

      - name: Guardar el cambio en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snih-niveles.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar niveles SNIH"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Avisar si el SNIH no responde
        if: steps.robot.outcome == 'failure'
        run: |
          echo "El SNIH no respondió desde GitHub. Ver el paso 'Traer los niveles del SNIH'."
          exit 1
