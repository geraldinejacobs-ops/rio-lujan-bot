name: Actualizar nivel rio Lujan (Mercedes)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: actualizar-rio-lujan
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Traer el dato del rio
        id: robot
        continue-on-error: true
        run: node scripts/update-rio-lujan.js

      - name: Guardar el cambio en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rio-lujan-mercedes.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar nivel rio Lujan"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1

      - name: Avisar si la estación no informa
        if: steps.robot.outcome == 'failure'
        run: |
          echo "La estación de García no está informando (o la UNLu no respondió). Ver el paso anterior."
          exit 1
