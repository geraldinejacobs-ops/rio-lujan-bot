name: Actualizar nivel río Luján (Mercedes) on: schedule: - cron: '*/15 * * * *' workflow_dispatch: {} permissions: contents: write jobs: actualizar: runs-on: ubuntu-latest steps: - name: Descargar el repositorio uses: actions/checkout@v4 - name: Preparar Node.js uses: actions/setup-node@v4 with: node-version: 20 - name: Traer el dato del río run: node scripts/update-rio-lujan.js - name: Guardar el cambio en el repositorio run: | git config user.name "github-actions[bot]" git config user.email "github-actions[bot]@users.noreply.github.com" git add data/rio-lujan-mercedes.json git diff --staged --quiet || git commit -m "Actualizar nivel río Luján" git push
